name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: ./gradlew assembleRelease

      # The fork carries a committed throwaway test keystore (keystore/
      # comfyflux-test.jks); replace it before any real release. The release
      # is created straight from the pipeline, no artifact dance needed.
      - name: Create GitHub release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "ComfyFlux $GITHUB_REF_NAME" \
            --notes "Bugfix build: class_type-based workflow patching, correct websocket lifecycle (errors/interrupts surfaced), prompt escaping fix, no more API-key logging. Signed with the fork's test keystore - uninstall any older ComfyFlux install first."
