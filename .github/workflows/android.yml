name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest ships a licensed Android SDK; setup-android@v3 was
      # failing on current runner images and provides nothing extra.
      # Tests run before packaging: v1.26 shipped a "fix" that a commit
      # never contained, and nothing in CI would have noticed.
      - name: Test + build release APK
        run: ./gradlew testDebugUnitTest assembleRelease

      # The fork carries a committed throwaway test keystore (keystore/
      # comfyflux-test.jks); replace it before any real release. The release
      # is created straight from the pipeline, no artifact dance needed.
      - name: Create GitHub release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "ComfyFlux $GITHUB_REF_NAME" \
            --notes "ComfyFlux $GITHUB_REF_NAME. Changes: https://github.com/sebastian-burlacu/ComfyFlux/commits/$GITHUB_REF_NAME"
